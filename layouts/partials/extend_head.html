<!-- Sekmedeki Dünya İkonunu (Favicon) Şimşek Logosuna Dönüştürür -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

<!-- Google Arama Sonuçlarında Küçük/Büyük Resim Önizlemesine İzin Ver (Ürün Fotoğrafı İçin) -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

<!-- OpenGraph & Twitter Kapak Görseli Etiketleri (Google ve Sosyal Medya İçin) -->
{{- if .Params.cover.image }}
<meta property="og:image" content="{{ .Params.cover.image }}">
<meta name="twitter:image" content="{{ .Params.cover.image }}">
<meta name="twitter:card" content="summary_large_image">
{{- else if .Params.images }}
<meta property="og:image" content="{{ index .Params.images 0 }}">
<meta name="twitter:image" content="{{ index .Params.images 0 }}">
<meta name="twitter:card" content="summary_large_image">
{{- end }}
