baseURL = "https://mustafatire.online/"
languageCode = "tr-TR"
title = "Donanım Avcısı Fırsatları"
description = "En güncel donanım indirimleri, teknoloji fırsatları, bilgisayar parçaları ve sıcak Amazon indirimleri."
author = "Donanım Avcısı"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changefreq = "daily"
  priority = 0.8
  filename = "sitemap.xml"

[params]
  env = "production"
  description = "En güncel donanım indirimleri, teknoloji fırsatları ve sıcak Amazon indirimleri."
  author = "Donanım Avcısı"
  
  # Görsel & Arayüz Özellikleri
  disableSpecial1stPost = true
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = true

  # Sadece Türkiye'de Aktif Kullanılan Paylaşım Butonları
  ShareButtons = ["telegram", "whatsapp", "x", "facebook"]

  # PaperMod Schema (Google Yapısal Veri Ayarı)
  [params.schema]
    publisherType = "Organization"

  # Telegram İkonu
  [[params.socialIcons]]
    name = "telegram"
    url = "https://t.me/donanimavcisi"

# Üst Menü Navigasyonu
[[menu.main]]
  identifier = "home"
  name = "🏠 Ana Sayfa"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "🏷️ Kategoriler"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "telegram"
  name = "📢 Telegram Kanalı"
  url = "https://t.me/donanimavcisi"
  weight = 30

# İlgili/Benzer Ürünler Algoritması
[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "title"
    weight = 100
